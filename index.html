<body>
  <div class="app-shell" id="appShell">
    <!-- Renderização total por JS no #appShell. -->
  </div>

  <!-- Camada de toast leve para mensagens curtas (copiado, etc) -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="./categories.js"></script>
  <script src="./app.js"></script>
  <script>
    // Registro silencioso do service worker (não trava o app se falhar)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* ignora */ });
      });
    }
  </script>
